<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" fill="none">
  <defs>
    <style>
      .bg { fill: #fff; }
      .bg-dark { fill: #0d0d0d; }
      .fg { fill: #1a1a1a; }
      .fg-dark { fill: #e6e6e6; }
      .muted { fill: #666; }
      .muted-dark { fill: #888; }
      .card { fill: #f7f7f7; }
      .card-dark { fill: #141414; }
      .border { fill: #e0e0e0; }
      .border-dark { fill: #2a2a2a; }
      .accent { fill: #000; }
      .accent-dark { fill: #fff; }
      .good { fill: #1a7f37; }
      .bad { fill: #cf222e; }
      .good-dark { fill: #3fb950; }
      .bad-dark { fill: #f85149; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Consolas', 'Liberation Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="960" height="520" rx="12"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" class="title" font-size="22" fill="#1a1a1a">Repository Navigation Compression Layer</text>
  <text x="480" y="66" text-anchor="middle" class="body" font-size="13" fill="#666">Same query. Same codebase. Different approach.</text>

  <!-- LEFT: Without MCP -->
  <rect x="32" y="88" width="436" height="412" class="card" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="32" y="88" width="436" height="44" rx="8" fill="#cf222e" opacity="0.08"/>
  <text x="250" y="116" text-anchor="middle" class="title" font-size="16" fill="#cf222e">Without Context Signals</text>

  <!-- File icons -->
  <g transform="translate(56, 156)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/server.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#cf222e" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#cf222e">12k chars</text>
  </g>
  <g transform="translate(56, 192)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/routes/index.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#cf222e" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#cf222e">8k chars</text>
  </g>
  <g transform="translate(56, 228)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/routes/upload.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#cf222e" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#cf222e">6k chars</text>
  </g>
  <g transform="translate(56, 264)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/middleware/auth.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#cf222e" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#cf222e">3k chars</text>
  </g>
  <g transform="translate(56, 300)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/controllers/...</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#cf222e" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#cf222e">4k chars</text>
  </g>

  <!-- More files indicator -->
  <g transform="translate(56, 336)">
    <circle cx="12" cy="6" r="3" fill="#666"/>
    <circle cx="24" cy="6" r="3" fill="#666"/>
    <circle cx="36" cy="6" r="3" fill="#666"/>
  </g>

  <!-- Left stats -->
  <g transform="translate(56, 360)">
    <rect x="0" y="0" width="388" height="1" fill="#e0e0e0"/>
    <text x="0" y="24" class="body" font-size="13" fill="#666">Files read</text>
    <text x="388" y="24" text-anchor="end" class="title" font-size="18" fill="#cf222e">12</text>
  </g>
  <g transform="translate(56, 396)">
    <text x="0" y="12" class="body" font-size="13" fill="#666">Tokens consumed</text>
    <text x="388" y="12" text-anchor="end" class="title" font-size="18" fill="#cf222e">40k</text>
  </g>
  <g transform="translate(56, 432)">
    <text x="0" y="12" class="body" font-size="13" fill="#666">Search loops</text>
    <text x="388" y="12" text-anchor="end" class="title" font-size="18" fill="#cf222e">8</text>
  </g>

  <!-- Divider arrow -->
  <g transform="translate(480, 260)">
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#1a1a1a" stroke-width="2"/>
    <polygon points="0,-48 -6,-40 6,-40" fill="#1a1a1a"/>
    <text x="0" y="20" text-anchor="middle" class="title" font-size="14" fill="#1a1a1a">70% less context</text>
  </g>

  <!-- RIGHT: With Context Signals -->
  <rect x="492" y="88" width="436" height="412" class="card" rx="8" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="492" y="88" width="436" height="44" rx="8" fill="#1a7f37" opacity="0.08"/>
  <text x="710" y="116" text-anchor="middle" class="title" font-size="16" fill="#1a7f37">With Context Signals</text>

  <!-- Signal result box -->
  <g transform="translate(516, 156)">
    <rect x="0" y="0" width="388" height="80" rx="6" fill="#1a7f37" opacity="0.06" stroke="#1a7f37" stroke-width="1" stroke-dasharray="4"/>
    <text x="16" y="22" class="title" font-size="13" fill="#1a7f37">Search result: POST /upload</text>
    <text x="16" y="44" class="mono" font-size="11" fill="#1a1a1a">route: POST /upload</text>
    <text x="16" y="60" class="mono" font-size="11" fill="#1a1a1a">file:  src/routes/upload.ts  line: 42</text>
    <text x="16" y="76" class="mono" font-size="11" fill="#1a1a1a">handler: uploadFileHandler</text>
  </g>

  <!-- Right files -->
  <g transform="translate(516, 256)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/routes/upload.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#1a7f37" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#1a7f37">2k chars</text>
  </g>
  <g transform="translate(516, 292)">
    <rect x="0" y="0" width="200" height="28" rx="4" fill="#f0f0f0"/>
    <text x="12" y="19" class="mono" font-size="11" fill="#666">src/middleware/auth.ts</text>
    <rect x="212" y="4" width="48" height="18" rx="3" fill="#1a7f37" opacity="0.12"/>
    <text x="216" y="17" class="mono" font-size="9" fill="#1a7f37">1k chars</text>
  </g>

  <!-- Right stats -->
  <g transform="translate(516, 340)">
    <rect x="0" y="0" width="388" height="1" fill="#e0e0e0"/>
    <text x="0" y="24" class="body" font-size="13" fill="#666">Files read</text>
    <text x="388" y="24" text-anchor="end" class="title" font-size="18" fill="#1a7f37">4</text>
  </g>
  <g transform="translate(516, 376)">
    <text x="0" y="12" class="body" font-size="13" fill="#666">Tokens consumed</text>
    <text x="388" y="12" text-anchor="end" class="title" font-size="18" fill="#1a7f37">12k</text>
  </g>
  <g transform="translate(516, 412)">
    <text x="0" y="12" class="body" font-size="13" fill="#666">Search loops</text>
    <text x="388" y="12" text-anchor="end" class="title" font-size="18" fill="#1a7f37">3</text>
  </g>

  <!-- Bottom tagline -->
  <text x="480" y="504" text-anchor="middle" class="mono" font-size="11" fill="#666">Context Signals: a compact structural map before reading full source files</text>
</svg>
